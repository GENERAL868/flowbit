name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # mpv.exe isn't in the repository (over GitHub's file size limit); the build
      # only needs a file at that path
      - name: Placeholder for mpv.exe
        shell: pwsh
        run: New-Item -ItemType File -Force resources/mpv/mpv.exe | Out-Null

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Check the UI scripts
        working-directory: ui
        run: |
          node --check app.js
          node --check i18n.js

  linux:
    # The oldest supported Ubuntu, so the packages run on older distributions too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Build dependencies
        run: ./.github/scripts/linux-deps.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build the packages
        run: |
          npm ci
          npx tauri build --bundles deb,rpm,appimage

      - name: Start the app
        run: ./.github/scripts/linux-smoke-test.sh src-tauri/target/release/flowbit .github/test-data/ubuntu-24.04.3-live-server-amd64.iso.torrent

      - uses: actions/upload-artifact@v5
        with:
          name: flowbit-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14
