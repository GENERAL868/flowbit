name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # mpv.exe isn't in the repository (over GitHub's file size limit); the build
      # only needs a file at that path
      - name: Placeholder for mpv.exe
        shell: pwsh
        run: New-Item -ItemType File -Force resources/mpv/mpv.exe | Out-Null

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Check the UI scripts
        working-directory: ui
        run: |
          node --check app.js
          node --check i18n.js
