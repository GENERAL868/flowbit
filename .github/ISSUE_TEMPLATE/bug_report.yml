name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a magnet link…
        2. Open the files…
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Flowbit version
      description: Shown at the bottom of Preferences.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Which download?
      options:
        - Windows installer
        - Windows portable
        - Linux .deb
        - Linux .rpm
        - Linux AppImage
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2, Ubuntu 24.04, Fedora 41…
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - Arabic
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Please don't link torrents of copyrighted material. A public test torrent (a Linux ISO, for example) is fine.
