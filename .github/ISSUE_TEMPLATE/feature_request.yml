name: Feature request
description: An idea to make Flowbit better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or the situation, more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Flowbit help?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today?
