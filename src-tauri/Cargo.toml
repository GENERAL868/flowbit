[package]
name = "flowbit"
version = "1.3.0"
description = "Streaming torrent client"
authors = ["Flowbit contributors"]
license = "MIT"
repository = "https://github.com/GENERAL868/flowbit"
homepage = "https://github.com/GENERAL868/flowbit"
edition = "2021"
rust-version = "1.85"

[lib]
name = "flowbit_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-notification = "=2.7.0"
# rust-tls: SHA-1 from ring instead of the unmaintained crypto-hash crate
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "fs", "io-util"] }
# Already built for librqbit; used by the subtitle translator
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"
# Same versions as wry uses, for reading dropped files' paths (src/drop.rs)
webview2-com = "=0.39.1"
windows = "=0.62.2"

# librqbit 9.0.1 with a fix for marking downloads sparse on Windows (see
# patches/librqbit/src/storage/filesystem/opened_file.rs, try_mark_sparse)
[patch.crates-io]
librqbit = { path = "patches/librqbit" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
