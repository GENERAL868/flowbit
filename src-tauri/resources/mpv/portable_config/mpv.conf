# Defaults for mpv as Flowbit's player. Everything else is mpv as usual:
# its on-screen controller, keyboard shortcuts and subtitle rendering.

# Hardware decoding where it's safe, and a modern renderer
hwdec=auto-safe
vo=gpu-next

# Window: open at most 85% of the screen, centered
autofit-larger=85%x85%
geometry=50%:50%

# Subtitles: load matching files next to the video, keep styled (ASS) subtitles as is
sub-auto=fuzzy
sub-font-size=44
sub-border-size=2.5
sub-ass-override=no

# Streaming: buffer ahead generously, and wait for slow peers instead of giving up
cache=yes
demuxer-max-bytes=200MiB
demuxer-max-back-bytes=50MiB
demuxer-readahead-secs=60
network-timeout=120

# Screenshots (s key) go to the desktop
screenshot-directory=~~desktop/
screenshot-format=png

osd-bar=yes
osd-font-size=36
